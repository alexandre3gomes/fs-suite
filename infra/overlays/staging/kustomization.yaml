apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  # Override configmap for staging
  - target:
      kind: ConfigMap
      name: api-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: api-config
      data:
        NODE_ENV: "staging"
        GOOGLE_CALLBACK_URL: "https://api-staging.fssuite.app/v1/auth/google/callback"
        WEB_ORIGIN: "https://staging.fssuite.app"
        SENTRY_RELEASE: "__DEPLOY_RELEASE__"

  # Override ingress for staging domain
  - target:
      kind: Ingress
      name: api-ingress
    patch: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: api-ingress
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-staging"
      spec:
        tls:
          - hosts:
              - api-staging.fssuite.app
            secretName: api-staging-tls
        rules:
          - host: api-staging.fssuite.app
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: api
                      port:
                        number: 3001
