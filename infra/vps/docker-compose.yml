# Log rotation is not a default. Docker's json-file driver grows without
# bound until it fills the disk, and the file lives inside the container, so
# every deploy discards the history. 20 MB x 5 files per service caps it at
# 200 MB total and keeps roughly a week of traffic at current volume.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  api:
    image: ghcr.io/alexandre3gomes/fs-suite-api:latest
    env_file: .env
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
