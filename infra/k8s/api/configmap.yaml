apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: fs-suite
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: fs-suite
data:
  NODE_ENV: "production"
  PORT: "3001"
  DATABASE_URL: "postgresql://fssuite:$(POSTGRES_PASSWORD)@postgres:5432/fssuite"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis:6379"
  GOOGLE_CALLBACK_URL: "https://api.fssuite.app/v1/auth/google/callback"
  WEB_ORIGIN: "https://fssuite.app"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "30d"
