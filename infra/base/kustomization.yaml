apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fs-suite

resources:
  - namespace.yaml
  - api/configmap.yaml
  - api/secret.yaml
  - api/deployment.yaml
  - api/service.yaml
  - ingress/ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
