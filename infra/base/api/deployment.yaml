apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fs-suite
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: fs-suite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: fs-suite
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/alexandre3gomes/fs-suite/api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          workingDir: /app/apps/api
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://fssuite:$(POSTGRES_PASSWORD)@postgres:5432/fssuite"
      containers:
        - name: api
          image: ghcr.io/alexandre3gomes/fs-suite/api:latest
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: PORT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://fssuite:$(POSTGRES_PASSWORD)@postgres:5432/fssuite"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: GOOGLE_CALLBACK_URL
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_PUBLIC_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: ENCRYPTION_KEY
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: WEB_ORIGIN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SENTRY_DSN
            - name: SENTRY_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: SENTRY_RELEASE
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      restartPolicy: Always
