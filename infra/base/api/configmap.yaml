apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: fs-suite
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: fs-suite
data:
  NODE_ENV: "production"
  PORT: "3001"
  GOOGLE_CALLBACK_URL: "https://api.fssuite.app/v1/auth/google/callback"
  VATSIM_CALLBACK_URL: "https://api.fssuite.app/v1/auth/vatsim/callback"
  VATSIM_OAUTH_BASE_URL: "https://auth.vatsim.net"
  WEB_ORIGIN: "https://fssuite.app"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "30d"
  SENTRY_RELEASE: "__DEPLOY_RELEASE__"
