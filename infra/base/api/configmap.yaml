apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: fs-suite
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: fs-suite
data:
  NODE_ENV: "production"
  PORT: "3001"
  GOOGLE_CALLBACK_URL: "https://api.fs-suite.com/v1/auth/google/callback"
  WEB_ORIGIN: "https://fs-suite.com"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "30d"
  SENTRY_RELEASE: "__DEPLOY_RELEASE__"
