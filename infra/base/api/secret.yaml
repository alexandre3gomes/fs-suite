apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: fs-suite
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: fs-suite
type: Opaque
stringData:
  # Replace these values before applying to the cluster.
  # In production, use sealed-secrets, external-secrets, or OCI Vault.
  DATABASE_URL: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  JWT_PRIVATE_KEY: "REPLACE_ME"
  JWT_PUBLIC_KEY: "REPLACE_ME"
  ENCRYPTION_KEY: "REPLACE_ME"
  SENTRY_DSN: ""
  SENTRY_AUTH_TOKEN: ""
