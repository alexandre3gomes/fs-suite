name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - '.github/workflows/deploy-app.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Expo web
        run: cd apps/app && npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.fs-suite.com

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/app/dist --project-name=fs-suite-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
