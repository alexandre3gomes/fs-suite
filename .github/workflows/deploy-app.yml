name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - '.github/workflows/deploy-app.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @fs-suite/types resolves to ./dist/index.js (the API consumes the
      # compiled output), so any runtime value import from it (e.g. enums)
      # needs dist built before Metro bundles the web app. @fs-suite/ui
      # resolves from source and needs no build.
      - name: Build shared packages
        run: pnpm --filter @fs-suite/types build

      - name: Build Expo web
        run: cd apps/app && npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.fs-suite.com
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          # Frontend reuses the backend's Sentry DSN — same project, errors
          # are separable by SDK tag (javascript vs node). Release pinned to
          # the commit SHA so frontend traces line up with the GH commit.
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          # Optional OpenAIP tile key for the VFR map airspace overlay. Inlined
          # into the client bundle at build time (EXPO_PUBLIC_*), so it is public
          # by design, not a true secret. When unset the overlay is hidden and
          # the rest of the map keeps working.
          EXPO_PUBLIC_OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}

      - name: Create Cloudflare Pages project (if needed)
        run: npx wrangler pages project create fs-suite-app --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/app/dist --project-name=fs-suite-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test (post-deploy)
        run: ./scripts/smoke-test.sh
