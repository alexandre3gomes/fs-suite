name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - '.github/workflows/deploy.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fs-suite-api

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/fs-suite
            sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=${{ steps.sha.outputs.short }}/" .env
            docker compose pull api
            docker compose up -d api
            sleep 5
            curl -sf http://localhost/v1/health || echo "Warning: health check failed"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Container status:"
            docker compose -f /opt/fs-suite/docker-compose.yml ps
            echo ""
            echo "Health check:"
            curl -s http://localhost/v1/health
