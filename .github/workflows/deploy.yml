name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - '.github/workflows/deploy.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/fs-suite-api
  GCP_IMAGE: europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fs-suite/api

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GCP_IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.GCP_IMAGE }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Migrate Database
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Run migrations via EC2
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u github-actions --password-stdin
            cd /opt/fs-suite
            # `--quiet false` so the pull output (or any auth error) reaches the run log
            docker compose pull api
            docker compose run --rm api npx prisma migrate deploy

  deploy-ec2:
    name: Deploy EC2
    needs: [build, migrate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY_OWNER,GITHUB_SHORT_SHA
          script: |
            set -euo pipefail
            cd /opt/fs-suite

            # ── 1. Disk budget check ────────────────────────────
            # Fail loud and early if the host is dangerously close to
            # full. Below ~15% free, layer extraction may silently
            # corrupt the pull and leave :latest pointing at the old
            # image (see 2026-05-27 incident).
            USE_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            echo "Host disk usage before deploy: ${USE_PCT}%"
            if [ "$USE_PCT" -ge 85 ]; then
              echo "::warning::Disk usage at ${USE_PCT}% — pruning before pull"
            fi

            # ── 2. Garbage-collect old images ───────────────────
            # Keep only the 3 newest unique fs-suite-api images (current +
            # 2 prior, for rollback). Each image is ~2 GB; without this
            # the host filled up in ~3 weeks. The running container is
            # always tagged :latest, which is image #1 in the list, so
            # it's never removed.
            #
            # Count-based instead of age-based because a slow deploy week
            # would otherwise let images accumulate beyond what the disk
            # can hold.
            REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER}/fs-suite-api
            OLD_IDS=$(docker images "$REPO" --filter "dangling=false" --format "{{.ID}}" \
              | awk '!seen[$0]++' | tail -n +4)
            if [ -n "$OLD_IDS" ]; then
              echo "Removing $(echo "$OLD_IDS" | wc -l) old fs-suite-api image(s)..."
              echo "$OLD_IDS" | xargs docker rmi -f || true
            fi
            # Builder cache stays age-based — it's pure storage waste, not
            # versioned artifacts. 7 days is fine.
            docker builder prune -af --filter "until=168h" || true

            # ── 3. Login + pull both :latest and the SHA tag ────
            # Pulling :latest alone is unreliable as a verification
            # signal because two builds with identical app source
            # produce identical digests (the tag just doesn't move).
            # The SHA tag is unambiguous: if we can pull and locate
            # the image for THIS commit, the pull worked.
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u github-actions --password-stdin

            IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER}/fs-suite-api
            docker compose pull api
            docker pull "${IMAGE_REPO}:${GITHUB_SHORT_SHA}"

            SHA_DIGEST=$(docker image inspect "${IMAGE_REPO}:${GITHUB_SHORT_SHA}" --format '{{.Id}}' 2>/dev/null || echo absent)
            LATEST_DIGEST=$(docker image inspect "${IMAGE_REPO}:latest" --format '{{.Id}}' 2>/dev/null || echo absent)
            echo "Expected (:${GITHUB_SHORT_SHA}): $SHA_DIGEST"
            echo "Running  (:latest):             $LATEST_DIGEST"

            # ── 4. Verify the new image is locally present ──────
            # `docker compose pull` returns 0 even if layer
            # extraction fails (e.g. ENOSPC), so we cross-check the
            # SHA tag explicitly. If we can't see it on disk, the
            # pull was bogus and the deploy must NOT proceed.
            if [ "$SHA_DIGEST" = "absent" ]; then
              echo "::error::Image ${IMAGE_REPO}:${GITHUB_SHORT_SHA} not present after pull — extraction likely failed silently"
              df -h /
              sudo journalctl -u docker --since "5 min ago" --no-pager | tail -30 || true
              exit 1
            fi
            if [ "$LATEST_DIGEST" != "$SHA_DIGEST" ]; then
              echo "::error:::latest ($LATEST_DIGEST) does not match :${GITHUB_SHORT_SHA} ($SHA_DIGEST). The build pushed both tags together; a mismatch means :latest's pull was incomplete."
              df -h /
              exit 1
            fi

            # ── 5. Restart with fresh image ─────────────────────
            sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=${GITHUB_SHORT_SHA}/" .env
            docker compose up -d api

      - name: Smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost/v1/health > /dev/null 2>&1; then
                echo "Health check passed (attempt $i)"
                docker compose -f /opt/fs-suite/docker-compose.yml ps
                exit 0
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 5 attempts"
            docker compose -f /opt/fs-suite/docker-compose.yml logs --tail=20 api
            exit 1

      - name: Seed aircraft catalog
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/fs-suite
            docker compose run --rm api npx tsx prisma/seed-aircraft-prod.ts

  deploy-cloudrun:
    name: Deploy Cloud Run
    needs: [build, migrate]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fs-suite-api \
            --image europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fs-suite/api:${{ needs.build.outputs.short_sha }} \
            --region europe-west2 \
            --platform managed \
            --service-account fs-suite-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --port 3001 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 300 \
            --concurrency 80 \
            --cpu-boost \
            --set-env-vars "\
          NODE_ENV=production,\
          GOOGLE_CALLBACK_URL=https://api.fs-suite.com/v1/auth/google/callback,\
          WEB_ORIGIN=https://fs-suite.com,\
          JWT_ACCESS_EXPIRES_IN=15m,\
          JWT_REFRESH_EXPIRES_IN=30d,\
          SENTRY_RELEASE=${{ needs.build.outputs.short_sha }},\
          R2_BUCKET_NAME=fs-suite-charts,\
          API_PUBLIC_URL=https://api.fs-suite.com,\
          SUPABASE_URL=https://kottmfuncqyzwtweoquw.supabase.co" \
            --set-secrets "\
          DATABASE_URL=database-url:latest,\
          REDIS_URL=redis-url:latest,\
          RESEND_API_KEY=resend-api-key:latest,\
          SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,\
          GOOGLE_CLIENT_ID=google-client-id:latest,\
          GOOGLE_CLIENT_SECRET=google-client-secret:latest,\
          JWT_PRIVATE_KEY=jwt-private-key:latest,\
          JWT_PUBLIC_KEY=jwt-public-key:latest,\
          ENCRYPTION_KEY=encryption-key:latest,\
          SENTRY_DSN=sentry-dsn:latest,\
          GEMINI_API_KEY=gemini-api-key:latest,\
          GROQ_API_KEY=groq-api-key:latest,\
          R2_ACCOUNT_ID=r2-account-id:latest,\
          R2_ACCESS_KEY_ID=r2-access-key-id:latest,\
          R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,\
          ADMIN_METRICS_TOKEN=admin-metrics-token:latest" \
            --allow-unauthenticated

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe fs-suite-api \
            --region europe-west2 \
            --format 'value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/v1/health" --max-time 30 || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i returned ${STATUS}, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts (last status: ${STATUS})"
          exit 1

  smoke-test:
    name: Smoke test (post-deploy)
    needs: [deploy-ec2, deploy-cloudrun]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test (api + candidate; frontend untouched here)
        run: ./scripts/smoke-test.sh api candidate
