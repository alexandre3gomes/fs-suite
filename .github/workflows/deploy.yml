name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/types/**'
      - 'packages/config/**'
      - '.github/workflows/deploy.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: fs-suite-api
  AR_REPO: fs-suite

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ steps.sha.outputs.short }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ steps.sha.outputs.short }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --port 3001 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 300 \
            --concurrency 80 \
            --cpu-boost \
            --set-env-vars "\
          NODE_ENV=production,\
          GOOGLE_CALLBACK_URL=https://api.fs-suite.com/v1/auth/google/callback,\
          WEB_ORIGIN=https://fs-suite.com,\
          JWT_ACCESS_EXPIRES_IN=15m,\
          JWT_REFRESH_EXPIRES_IN=30d,\
          SENTRY_RELEASE=${{ steps.sha.outputs.short }},\
          R2_BUCKET_NAME=fs-suite-charts" \
            --set-secrets "\
          DATABASE_URL=database-url:latest,\
          REDIS_URL=redis-url:latest,\
          GOOGLE_CLIENT_ID=google-client-id:latest,\
          GOOGLE_CLIENT_SECRET=google-client-secret:latest,\
          JWT_PRIVATE_KEY=jwt-private-key:latest,\
          JWT_PUBLIC_KEY=jwt-public-key:latest,\
          ENCRYPTION_KEY=encryption-key:latest,\
          SENTRY_DSN=sentry-dsn:latest,\
          GEMINI_API_KEY=gemini-api-key:latest,\
          GROQ_API_KEY=groq-api-key:latest,\
          R2_ACCOUNT_ID=r2-account-id:latest,\
          R2_ACCESS_KEY_ID=r2-access-key-id:latest,\
          R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest" \
            --allow-unauthenticated

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Service URL: ${URL}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/v1/health" --max-time 30 || true)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed"
          else
            echo "Warning: health check returned ${STATUS} (may still be starting)"
          fi
