name: Deploy Edge

# Deploys Cloudflare Workers under apps/edge-*/.
# Currently: api-candidate (stable proxy to Cloud Run).

on:
  push:
    branches: [main]
    paths:
      - 'apps/edge-api-candidate/**'
      - '.github/workflows/deploy-edge.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  deploy-api-candidate:
    name: api-candidate Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Deploy
        # Use `publish-worker` instead of `deploy` because `pnpm deploy`
        # is a built-in pnpm command (workspace bundling) that pre-empts
        # the script lookup.
        run: pnpm --filter @fs-suite/edge-api-candidate publish-worker
        env:
          # Token must include the "Workers Scripts:Edit" scope in
          # addition to the "Pages:Edit" scope already used by
          # deploy-app.yml. See infra/README.md → Secrets.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
