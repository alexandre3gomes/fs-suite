name: Metrics Digest

# Daily snapshot of operational metrics, posted as a comment on a single
# pinned GitHub issue (one issue, many comments — easy visual comparison
# across days; GitHub emails subscribers on each new comment).
#
# Required GitHub secrets:
#   - ADMIN_METRICS_TOKEN — must match the value of $ADMIN_METRICS_TOKEN
#     set on the API server (header-token auth for /v1/admin/metrics).

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily
  workflow_dispatch:

concurrency:
  group: metrics-digest
  cancel-in-progress: false

env:
  API_URL: https://api.fs-suite.com
  DB_CAP_BYTES: 524288000 # 500 MB — Supabase free-tier cap
  REDIS_CAP_BYTES: 268435456 # 256 MB — Upstash free-tier cap
  ISSUE_LABEL: metrics
  ISSUE_TITLE: Daily Metrics Digest
  # Logo for the email signature — served from the public Supabase
  # `communications` bucket. (From/To live on the send step; the recipient
  # is a secret since this repo is public.)
  LOGO_URL: https://kottmfuncqyzwtweoquw.supabase.co/storage/v1/object/public/communications/email/fs-suite-logo.png

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch API metrics
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_METRICS_TOKEN }}
        run: |
          if ! curl -sSf -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            "${API_URL}/v1/admin/metrics" -o metrics.json; then
            echo "::error::Failed to fetch /v1/admin/metrics"
            exit 1
          fi
          echo "Raw payload:"
          cat metrics.json

      - name: Fetch EC2 host stats
        # SSH directly (not appleboy/ssh-action) so we can capture stdout
        # into a file for the body builder. Output goes to host.txt:
        # one line "USED_PCT TOTAL_GB" plus image count.
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "$EC2_USER@$EC2_HOST" "
            DISK=\$(df -h --output=pcent,size / | tail -1 | tr -s ' ' | sed 's/^ //')
            IMAGES=\$(sudo docker images --filter 'dangling=false' --format '{{.Repository}}' | wc -l)
            echo \"\$DISK \$IMAGES\"
          " > host.txt
          echo "host.txt:"
          cat host.txt

      - name: Build digest bodies (markdown + HTML email)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DB_BYTES=$(jq -r '.database.size_bytes' metrics.json)
          DB_MB=$(awk -v b="$DB_BYTES" 'BEGIN{printf "%.1f", b/1048576}')
          CAP_MB=$(awk -v c="$DB_CAP_BYTES" 'BEGIN{printf "%.0f", c/1048576}')
          DB_PCT=$(awk -v b="$DB_BYTES" -v c="$DB_CAP_BYTES" 'BEGIN{printf "%.1f", (b/c)*100}')

          USERS_TOTAL=$(jq -r '.users.total' metrics.json)
          USERS_NEW=$(jq -r '.users.new_7d' metrics.json)
          USERS_ACTIVE=$(jq -r '.users.active_7d' metrics.json)
          PLANS_TOTAL=$(jq -r '.plans.total' metrics.json)
          PLANS_NEW=$(jq -r '.plans.new_7d' metrics.json)
          SESSIONS=$(jq -r '.sessions.active' metrics.json)
          ACT_24H=$(jq -r '.activity.events_24h' metrics.json)
          ACT_7D=$(jq -r '.activity.events_7d' metrics.json)
          AI_7D=$(jq -r '.ai_validations_7d' metrics.json)
          OVERLAYS=$(jq -r '.chart_overlays' metrics.json)

          REDIS_BYTES=$(jq -r '.redis.used_memory_bytes' metrics.json)
          REDIS_KEYS=$(jq -r '.redis.total_keys' metrics.json)
          REDIS_MB=$(awk -v b="$REDIS_BYTES" 'BEGIN{printf "%.2f", b/1048576}')
          REDIS_CAP_MB=$(awk -v c="$REDIS_CAP_BYTES" 'BEGIN{printf "%.0f", c/1048576}')
          REDIS_PCT=$(awk -v b="$REDIS_BYTES" -v c="$REDIS_CAP_BYTES" 'BEGIN{printf "%.1f", (b/c)*100}')

          # host.txt layout: "USE_PCT SIZE_GB IMAGES"
          HOST_PCT=$(awk '{print $1}' host.txt | tr -dc '0-9')
          HOST_SIZE=$(awk '{print $2}' host.txt)
          HOST_IMAGES=$(awk '{print $3}' host.txt)

          {
            echo "## ${DATE} — Daily Metrics"
            echo ""
            echo "**EC2 disk**: ${HOST_PCT}% of ${HOST_SIZE} used · ${HOST_IMAGES} docker images"
            echo "**Database**: ${DB_MB} MB / ${CAP_MB} MB cap (${DB_PCT}%)"
            echo "**Redis**: ${REDIS_MB} MB / ${REDIS_CAP_MB} MB cap (${REDIS_PCT}%) · ${REDIS_KEYS} keys"
            echo "**Users**: ${USERS_TOTAL} total · ${USERS_NEW} new in 7d · ${USERS_ACTIVE} active in 7d"
            echo "**Flight plans**: ${PLANS_TOTAL} total · ${PLANS_NEW} new in 7d"
            echo "**Sessions**: ${SESSIONS} active"
            echo "**Activity**: ${ACT_24H} events in 24h, ${ACT_7D} in 7d"
            echo "**AI validations (7d)**: ${AI_7D}"
            echo "**Chart overlay cache**: ${OVERLAYS} entries"
            echo ""
            echo "_Metric definitions: see [Metrics Digest](https://github.com/${GITHUB_REPOSITORY}/blob/main/infra/README.md#metrics-digest) in infra/README.md._"
          } > body.md
          echo "Comment body:"
          cat body.md

          # HTML email body — same metrics, aviation/cockpit dark theme matching
          # the unsubscribe page. Inline CSS only (email clients strip <style>).
          # A red "%" cell flags caps over 80%.
          row() { # label value
            printf '<tr><td style="padding:8px 14px;border-bottom:1px solid #1c2940;color:#9fb0c3;font-size:13px;">%s</td><td style="padding:8px 14px;border-bottom:1px solid #1c2940;color:#e7edf5;font-size:13px;font-weight:600;text-align:right;">%s</td></tr>' "$1" "$2"
          }
          cat > body.html <<HTML
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1"/></head>
          <body style="margin:0;background:#0b1320;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <div style="max-width:560px;margin:0 auto;padding:40px 24px;">
            <div style="font-size:12px;letter-spacing:2px;color:#5b9bd5;text-transform:uppercase;margin-bottom:6px;">FS Suite</div>
            <h1 style="font-size:20px;color:#e7edf5;margin:0 0 20px;">Métricas diárias · ${DATE}</h1>
            <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;background:#0f1a2e;border:1px solid #1c2940;border-radius:8px;overflow:hidden;">
              $(row "EC2 disk" "${HOST_PCT}% de ${HOST_SIZE} · ${HOST_IMAGES} imagens")
              $(row "Database" "${DB_MB} MB / ${CAP_MB} MB (${DB_PCT}%)")
              $(row "Redis" "${REDIS_MB} MB / ${REDIS_CAP_MB} MB (${REDIS_PCT}%) · ${REDIS_KEYS} keys")
              $(row "Usuários" "${USERS_TOTAL} total · ${USERS_NEW} novos 7d · ${USERS_ACTIVE} ativos 7d")
              $(row "Planos de voo" "${PLANS_TOTAL} total · ${PLANS_NEW} novos 7d")
              $(row "Sessões ativas" "${SESSIONS}")
              $(row "Atividade" "${ACT_24H} eventos 24h · ${ACT_7D} 7d")
              $(row "Validações IA (7d)" "${AI_7D}")
              $(row "Cache de cartas" "${OVERLAYS} entradas")
            </table>
            <p style="font-size:11px;color:#5b6b80;margin:14px 0 0;">Definições das métricas em <a href="https://github.com/${GITHUB_REPOSITORY}/blob/main/infra/README.md#metrics-digest" style="color:#5b9bd5;">infra/README.md</a>.</p>
            <div style="margin-top:32px;padding-top:20px;border-top:1px solid #1c2940;">
              <img src="${LOGO_URL}" alt="FS Suite" width="120" style="display:block;height:auto;margin-bottom:10px;border:0;"/>
              <div style="color:#e7edf5;font-size:14px;font-weight:600;">Alexandre Silva</div>
              <div style="color:#9fb0c3;font-size:12px;">Founder &amp; Lead Engineer | FS Suite</div>
              <a href="https://github.com/alexandre3gomes/fs-suite/" style="color:#5b9bd5;font-size:12px;text-decoration:none;">https://github.com/alexandre3gomes/fs-suite/</a>
            </div>
          </div></body></html>
          HTML
          echo "HTML body bytes: $(wc -c < body.html)"

      - name: Send email digest (Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Sender is on the Resend-verified fs-suite.com domain. Recipients are
          # NOT hard-coded — they come from metrics.json (.admin_recipients),
          # populated by GET /v1/admin/metrics from the DB (User.isAdmin ∪
          # ADMIN_EMAILS). So granting admin in-app auto-subscribes the digest.
          EMAIL_FROM: FS Suite Metrics <metrics@fs-suite.com>
          EMAIL_REPLY_TO: metrics@fs-suite.com
        run: |
          if [[ -z "$RESEND_API_KEY" ]]; then
            echo "::error::RESEND_API_KEY secret is not set"
            exit 1
          fi
          RECIPIENTS=$(jq -r '.admin_recipients // [] | length' metrics.json)
          if [[ "$RECIPIENTS" -eq 0 ]]; then
            echo "::error::No admin recipients in metrics.json — is the API deployed with admin_recipients?"
            exit 1
          fi
          echo "Sending to ${RECIPIENTS} admin recipient(s)"

          DATE=$(date -u +%Y-%m-%d)
          # Build the JSON with jq so the HTML is escaped correctly (--rawfile),
          # never by hand. `to` is the admin list straight from metrics.json.
          jq -n \
            --arg from "$EMAIL_FROM" \
            --arg reply "$EMAIL_REPLY_TO" \
            --arg subject "FS Suite — Métricas ${DATE}" \
            --rawfile html body.html \
            --slurpfile m metrics.json \
            '{from:$from, to:($m[0].admin_recipients), reply_to:$reply, subject:$subject, html:$html}' \
            > payload.json

          # -sS shows errors; -f makes curl exit non-zero on HTTP >=400 so the
          # step fails loudly if Resend rejects (bad key, unverified domain…).
          HTTP=$(curl -sS -w '%{http_code}' -o resend-resp.json -X POST \
            https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "Resend HTTP ${HTTP}:"; cat resend-resp.json; echo
          if [[ "$HTTP" -ge 400 ]]; then
            echo "::error::Resend send failed (HTTP ${HTTP})"
            exit 1
          fi
          echo "Email digest sent (recipient redacted)"

      - name: Ensure label and issue exist; post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Label is idempotent; --force updates if color drifts.
          gh label create "${ISSUE_LABEL}" --color 0E8A16 \
            --description "Automated metrics digest" --force \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || true

          ISSUE_NUMBER=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label "${ISSUE_LABEL}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "No open metrics issue — creating one"
            ISSUE_URL=$(gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${ISSUE_TITLE}" \
              --label "${ISSUE_LABEL}" \
              --body "Daily operational snapshot. New comment appended on each run; subscribe to receive emails.")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            echo "Created issue #${ISSUE_NUMBER}"
          fi

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file body.md
          echo "Posted digest to issue #${ISSUE_NUMBER}"
