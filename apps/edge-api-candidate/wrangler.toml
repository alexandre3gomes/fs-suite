name = "fs-suite-api-candidate"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = false

# Route binding: requests to api-candidate.fs-suite.com are served by
# this Worker. The zone fs-suite.com must already be on the Cloudflare
# account (it is — Pages and DNS already live there).
routes = [
  { pattern = "api-candidate.fs-suite.com/*", zone_name = "fs-suite.com" }
]

[vars]
# Cloud Run service URL. Update if the service is destroyed and
# recreated (the random ID in the hostname changes only on full
# recreate, not on routine deploys). Find current value with:
#   gcloud run services describe fs-suite-api \
#     --region europe-west2 --format 'value(status.url)'
UPSTREAM_ORIGIN = "https://fs-suite-api-uvdurl4sfa-nw.a.run.app"
